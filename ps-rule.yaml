# PSRule for Azure on every kit (brief §7.2). Kits are DELIBERATELY insecure where the lab requires it;
# each such rule is excluded per kit below with the lab and reason, never globally.
configuration:
  AZURE_BICEP_FILE_EXPANSION: true # required for .bicepparam expansion; without it PSRule silently processes 0 rules
  AZURE_BICEP_PARAMS_FILE_EXPANSION: true
  AZURE_PARAMETER_FILE_EXPANSION: true

requires:
  PSRule.Rules.Azure: "1.47.0"

include:
  module:
    - PSRule.Rules.Azure

input:
  pathIgnore:
    - "**"
    - "!labs/**/*.bicepparam"

output:
  culture: [en-GB]

rule:
  exclude: []

# Per-kit suppressions: scoped to the kit's CI sample target name, never global. Each states why.
suppression:
  # storage-sas-leak (lab 1) deploys a DELIBERATELY vulnerable account; these misconfigurations are the
  # scenario the learner must find and fix (owner decision: option A).
  Azure.Storage.BlobPublicAccess: [bwsasexample01]   # scenario: anonymous blob access
  Azure.Storage.BlobAccessType: [bwsasexample01]     # scenario: public build-artifacts container
  Azure.Storage.LocalAuth: [bwsasexample01]          # scenario: shared-key access, so the leaked account-key SAS works
  Azure.Storage.Firewall: [bwsasexample01]           # probed from the internet (owner decision 3, option b)
  # Short-lived lab account, synthetic data, near-zero learner cost:
  Azure.Storage.UseReplication: [bwsasexample01]     # LRS is enough for a 45-minute lab
  Azure.Storage.SoftDelete: [bwsasexample01]         # soft delete would keep planted data after cleanup
  Azure.Storage.ContainerSoftDelete: [bwsasexample01]
  # app-trusts-everyone (lab 2) deploys DELIBERATELY vulnerable web apps (platform ADR-0030); these two are the
  # scenario the learner must find and fix:
  Azure.AppService.UseHTTPS: [bw-portal-example001, bw-api-example0001]      # scenario: plain HTTP allowed
  Azure.AppService.WebSecureFtp: [bw-portal-example001, bw-api-example0001]  # scenario: FTP allowed
  # Free (F1) plan, so the lab costs the learner nothing; F1 has no instance scaling, zones, Always On or health checks:
  Azure.AppService.MinPlan: [bw-plan-example1]
  Azure.AppService.PlanInstanceCount: [bw-plan-example1]
  Azure.AppService.AvailabilityZone: [bw-plan-example1]
  Azure.AppService.AlwaysOn: [bw-portal-example001, bw-api-example0001]
  Azure.AppService.WebProbe: [bw-portal-example001, bw-api-example0001]
  Azure.AppService.WebProbePath: [bw-portal-example001, bw-api-example0001]
  # The apps call no Azure resources, so a managed identity would be an identity with nothing to do:
  Azure.AppService.ManagedIdentity: [bw-portal-example001, bw-api-example0001]
